name: Weekly draft + publish

# Runs every Thursday at 13:00 UTC (21:00 Beijing) per PRD §5.4.
# Steps: summarize top-scoring items → export JSON → commit → GitHub Pages
# redeploys (via pages-deploy.yml on workflow_run).
on:
  schedule:
    - cron: "0 13 * * 4"
  workflow_dispatch:  # allow manual trigger for testing

permissions:
  contents: write  # commit items.json + items.db updates

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Summarize high-scoring items with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/summarize.py
        working-directory: ${{ github.workspace }}

      - name: Classify HR items into sub-modules
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/classify_hr.py
        working-directory: ${{ github.workspace }}

      - name: Freeze next Issue (binds top items by section + freshness)
        run: python scripts/freeze_issue.py
        working-directory: ${{ github.workspace }}

      - name: Export JSON snapshot for frontend
        run: python scripts/export.py
        working-directory: ${{ github.workspace }}

      - name: Commit issue draft
        run: |
          git config user.name  "The AI Native (bot)"
          git config user.email "ai-native@users.noreply.github.com"
          git add data/items.db web/data/items.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Weekly freeze: Issue auto-generated @ $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # NOTE: publishing is NOT chained via workflow_run (that cross-workflow
      # trigger proved unreliable — it never fired after the bot's commits). The
      # deploy job below runs in THIS workflow instead. The old Vercel deploy was
      # removed: it hung for months and froze the site; we now use GitHub Pages.

  # Build the static export from the freshly-frozen Issue and publish it to
  # GitHub Pages, in the same run (no workflow_run dependency).
  deploy:
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # pull the commit the draft job just pushed

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build static export (root path, for the custom domain)
        run: EXPORT=1 BASE_PATH= npm run build
        working-directory: web

      - name: Serve on the custom domain
        run: echo "the-ai-native.com" > web/out/CNAME

      - name: Disable Jekyll (keep Next's /_next assets)
        run: touch web/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

      - id: deployment
        uses: actions/deploy-pages@v4
