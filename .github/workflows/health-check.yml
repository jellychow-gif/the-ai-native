name: Site health check

# External daily check on the CANONICAL domain. Catches BOTH failure modes
# that silently froze the site in 2026-06/07:
#   1) no fresh content (pipeline / Anthropic API down)
#   2) deploys not reaching the-ai-native.vercel.app (alias drift)
# On failure, GitHub emails the repo owner (jellychow-gif). Verify your
# GitHub notification email at github.com/settings/emails.
on:
  schedule:
    - cron: "0 1 * * *"     # daily 09:00 Beijing (01:00 UTC)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical domain is up, correctly aliased, and fresh
        run: |
          set -euo pipefail
          SITE="https://the-ai-native.vercel.app"
          MAX_AGE_DAYS=10

          code=$(curl -s -o home.html -w "%{http_code}" "$SITE/")
          if [ "$code" != "200" ]; then
            echo "::error::homepage $SITE returned HTTP $code"; exit 1
          fi

          # Latest issue page must resolve (guards against alias drift to a
          # stale build that predates the newest issue). Read the clean
          # /issues/N href from the masthead link — robust to React markup.
          n=$(grep -oE "/issues/[0-9]+" home.html | grep -oE "[0-9]+" | sort -rn | head -1)
          if [ -n "${n:-}" ]; then
            icode=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/issues/$n")
            if [ "$icode" != "200" ]; then
              echo "::error::latest issue /issues/$n returned $icode — domain likely aliased to a stale build"; exit 1
            fi
            echo "Latest issue: $n (HTTP $icode)"
          fi

          python3 - "$MAX_AGE_DAYS" <<'PY'
          import re, sys, datetime
          max_age = int(sys.argv[1])
          html = open("home.html", encoding="utf-8").read()
          # Strip tags AND React's <!-- --> text-node markers so the date,
          # which renders as "Latest update · <!-- -->Jul 28, 2026<!-- --> BJT",
          # becomes contiguous text before matching.
          text = re.sub(r"<[^>]*>", " ", html)
          m = re.search(r"Latest update[^A-Za-z]*([A-Za-z]{3,9} \d{1,2}, \d{4})", text)
          if not m:
              print("::error::could not find 'Latest update' date on homepage"); sys.exit(1)
          d = datetime.datetime.strptime(m.group(1), "%b %d, %Y").date()
          age = (datetime.date.today() - d).days
          print(f"Latest update: {d} ({age} days ago)")
          if age > max_age:
              print(f"::error::SITE STALE — last updated {age} days ago (>{max_age}). "
                    f"Check the Anthropic API and the deploy alias.")
              sys.exit(1)
          print("OK: site is fresh")
          PY
