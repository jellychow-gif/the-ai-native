name: Daily scrape + score + summarize + publish

# Runs every day at 06:00 UTC (14:00 Beijing).
# Full pipeline: scrape → fetch_bodies → score → summarize → classify_hr →
# export → commit → (GitHub Pages deploy via pages-deploy.yml). Issue freezing
# remains weekly (Thursdays via weekly-draft.yml).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape sources
        run: python scripts/scrape.py
        working-directory: ${{ github.workspace }}

      - name: Fetch article bodies
        run: python scripts/fetch_bodies.py
        working-directory: ${{ github.workspace }}

      - name: Score new items with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/score.py
        working-directory: ${{ github.workspace }}

      - name: Summarize new high-scoring items with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/summarize.py
        working-directory: ${{ github.workspace }}

      - name: Classify new HR items into sub-modules
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/classify_hr.py
        working-directory: ${{ github.workspace }}

      - name: Export JSON snapshot for frontend
        run: python scripts/export.py
        working-directory: ${{ github.workspace }}

      - name: Commit pipeline state
        run: |
          git config user.name  "The AI Native (bot)"
          git config user.email "ai-native@users.noreply.github.com"
          git add data/items.db web/data/items.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Daily pipeline: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # Publishing is handled by pages-deploy.yml, which runs on workflow_run
      # after this pipeline completes (a bot push with GITHUB_TOKEN can't trigger
      # the Pages workflow's own `on: push`, so we chain it via workflow_run).
      # The old Vercel deploy step was removed — Vercel's build hung for months
      # and froze the site; the project now serves from GitHub Pages.
