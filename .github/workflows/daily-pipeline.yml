name: Daily scrape + score + summarize + publish

# Runs every day at 06:00 UTC (14:00 Beijing).
# Full pipeline: scrape → fetch_bodies → score → summarize → classify_hr →
# export → commit → (GitHub Pages deploy via pages-deploy.yml). Issue freezing
# remains weekly (Thursdays via weekly-draft.yml).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape sources
        run: python scripts/scrape.py
        working-directory: ${{ github.workspace }}

      - name: Fetch article bodies
        run: python scripts/fetch_bodies.py
        working-directory: ${{ github.workspace }}

      - name: Score new items with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/score.py
        working-directory: ${{ github.workspace }}

      - name: Summarize new high-scoring items with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/summarize.py
        working-directory: ${{ github.workspace }}

      - name: Classify new HR items into sub-modules
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/classify_hr.py
        working-directory: ${{ github.workspace }}

      - name: Export JSON snapshot for frontend
        run: python scripts/export.py
        working-directory: ${{ github.workspace }}

      - name: Commit pipeline state
        run: |
          git config user.name  "The AI Native (bot)"
          git config user.email "ai-native@users.noreply.github.com"
          git add data/items.db web/data/items.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Daily pipeline: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # NOTE: publishing is NOT chained via workflow_run (that cross-workflow
      # trigger proved unreliable — it never fired after the bot's commits). The
      # deploy job below runs in THIS workflow instead, so every pipeline run
      # publishes end to end. The old Vercel deploy was removed — it hung for
      # months and froze the site; the project now serves from GitHub Pages.

  # Build the static export from the freshly-committed content and publish it to
  # GitHub Pages. Self-contained (no workflow_run), so new content always goes
  # live in the same run that generated it.
  deploy:
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout
      pages: write     # publish to Pages
      id-token: write  # OIDC for deploy-pages
    # Share the Pages concurrency group with the standalone deploy workflow so
    # two deploys never race.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # pull the commit the pipeline job just pushed

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build static export (root path, for the custom domain)
        run: EXPORT=1 BASE_PATH= npm run build
        working-directory: web

      - name: Serve on the custom domain
        run: echo "the-ai-native.com" > web/out/CNAME

      - name: Disable Jekyll (keep Next's /_next assets)
        run: touch web/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

      - id: deployment
        uses: actions/deploy-pages@v4
