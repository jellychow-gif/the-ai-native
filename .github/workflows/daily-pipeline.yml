name: Daily scrape + score

# Runs every day at 06:00 UTC (14:00 Beijing).
# Steps: scrape → fetch_bodies → score. Summarization happens weekly.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write  # needed to commit updated items.db back

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape sources
        run: python scripts/scrape.py
        working-directory: ${{ github.workspace }}

      - name: Fetch article bodies
        run: python scripts/fetch_bodies.py
        working-directory: ${{ github.workspace }}

      - name: Score new items with Claude Haiku
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/score.py
        working-directory: ${{ github.workspace }}

      - name: Commit updated database
        run: |
          git config user.name  "The AI Native (bot)"
          git config user.email "ai-native@users.noreply.github.com"
          git add data/items.db || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Daily pipeline: scrape + score @ $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
