name: Deploy to GitHub Pages

# Free, reliable static hosting that actually deploys — replaces the Vercel
# path, whose remote build hung for months and froze the live site at Jul 30.
# Builds the Next.js static export (web/out) and publishes it to GitHub Pages
# on the custom domain the-ai-native.com.
#
# One-time setup in the repo (browser, no new account):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   Settings → Pages → Custom domain: the-ai-native.com (CNAME file below
#   sets it too). Then point DNS at GitHub Pages — see the project notes.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build static export (root path, for the custom domain)
        run: EXPORT=1 BASE_PATH= npm run build
        working-directory: web

      - name: Serve on the custom domain
        run: echo "the-ai-native.com" > web/out/CNAME

      # Pages uses Jekyll by default, which drops folders starting with "_"
      # (Next ships assets under /_next). This opt-out keeps them.
      - name: Disable Jekyll
        run: touch web/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
